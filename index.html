<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZMeet by Zenithal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
    body {
      background: #202124;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Navbar */
    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3c4043;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 500;
    }
    .brand span.logo-text { color: #8ab4f8; font-weight: 700; }
    .brand span.sub { font-size: 14px; color: #9aa0a6; }
    .header-time { font-size: 15px; color: #9aa0a6; }

    /* Main Split Hero Layout (Like Google Meet) */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
      gap: 48px;
      flex-wrap: wrap;
    }
    .left-panel { flex: 1; min-width: 300px; max-width: 540px; }
    .left-panel h1 {
      font-size: 42px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .left-panel p {
      font-size: 18px;
      color: #9aa0a6;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* Action Row: New Meeting + Enter Code */
    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-new {
      background: #8ab4f8;
      color: #202124;
      border: none;
      height: 48px;
      padding: 0 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-new:hover { background: #aecbfa; }

    .join-box {
      display: flex;
      align-items: center;
      border: 1px solid #5f6368;
      border-radius: 24px;
      height: 48px;
      padding: 0 16px;
      background: #202124;
    }
    .join-box:focus-within { border-color: #8ab4f8; }
    .join-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-size: 15px;
      width: 200px;
      margin-left: 8px;
    }
    .btn-join {
      background: transparent;
      border: none;
      color: #8ab4f8;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      padding: 8px 12px;
    }
    .btn-join:disabled { color: #5f6368; cursor: default; }

    /* Right Panel Preview Card */
    .right-panel {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .promo-circle {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3c4043, #292a2d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 84px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .right-panel h3 { font-size: 22px; font-weight: 400; margin-bottom: 8px; }
    .right-panel p { font-size: 14px; color: #9aa0a6; max-width: 340px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>📹</span>
      <span class="logo-text">ZMeet</span>
      <span class="sub">by Zenithal</span>
    </div>
    <div class="header-time" id="live-clock"></div>
  </header>

  <main>
    <div class="left-panel">
      <h1>Video calls and meetings for everyone</h1>
      <p>Connect, collaborate, and share a secure ZMeet link from anywhere—just like Google Meet.</p>

      <div class="action-row">
        <button class="btn-new" onclick="startZMeetCall()">
          <span>📹</span> New meeting
        </button>

        <div class="join-box">
          <span>⌨️</span>
          <input
            type="text"
            id="roomInput"
            placeholder="Enter a code or link"
            oninput="toggleJoinBtn()"
            onkeypress="if(event.key==='Enter') joinZMeetCall()"
          />
        </div>
        <button id="joinBtn" class="btn-join" onclick="joinZMeetCall()" disabled>Join</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="promo-circle">🔗</div>
      <h3>Get a link you can share</h3>
      <p>Click <strong>New meeting</strong> to get a link you can send to people you want to meet with. You control who enters.</p>
    </div>
  </main>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      document.getElementById('live-clock').innerText = `${timeStr} • ${dateStr}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Generate Google Meet style code: xxx-xxxx-xxx
    function createGoogleMeetCode() {
      const chars = 'abcdefghijklmnopqrstuvwxyz';
      const part = (len) => Array.from({ length: len }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
      return `${part(3)}-${part(4)}-${part(3)}`;
    }

    // Start New Meeting as Host (enables Lobby / Admit control)
    function startZMeetCall() {
      const roomCode = createGoogleMeetCode();
      window.location.href = `/meet.html?room=${roomCode}&host=true`;
    }

    // Enable/Disable Join button when typing
    function toggleJoinBtn() {
      const val = document.getElementById('roomInput').value.trim();
      document.getElementById('joinBtn').disabled = val.length === 0;
    }

    // Join Existing Meeting as Guest (accepts full URL or just room code)
    function joinZMeetCall() {
      const raw = document.getElementById('roomInput').value.trim();
      if (!raw) return;

      let roomCode = raw;
      if (raw.includes('room=')) {
        try {
          roomCode = new URL(raw).searchParams.get('room');
        } catch (e) {
          roomCode = raw.split('room=')[1].split('&')[0];
        }
      }
      window.location.href = `/meet.html?room=${roomCode}`;
    }
  </script>
</body>
</html>
