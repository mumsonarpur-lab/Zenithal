<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenithal — Official Web Search Engine</title>

  <meta property="og:site_name" content="Zenithal" />
  <meta property="og:title" content="Zenithal — Official Web Search Engine" />
  <meta property="og:description" content="Zenithal is a fast, clean, and modern web search engine built by Abhinit Pandey." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Zenithal",
    "alternateName": ["Zenithal Search", "Zenithal Search Engine"],
    "url": "https://vercel.app"
  }
  </script>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --sub: #94a3b8; --accent: #3b82f6; --border: #334155; }
    :root[data-theme="light"] { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --sub: #475569; --accent: #2563eb; --border: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 14px 20px; }
    .badge { background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; }
    .btn-sm { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .logo { font-size: 56px; font-weight: 800; color: var(--accent); letter-spacing: -1px; cursor: pointer; }
    .box { width: 100%; max-width: 580px; padding: 14px 20px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; outline: none; }
    .box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 11px 22px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.92; }
    .chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; }
    .chip:hover { border-color: var(--accent); }
    .main { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px 30px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; text-align: left; }
    .title { font-size: 18px; font-weight: 700; color: #60a5fa; text-decoration: none; }
    footer { text-align: center; padding: 20px 16px; color: var(--sub); font-size: 14px; border-top: 1px solid rgba(148, 163, 184, 0.15); margin-top: auto; }
    footer a { color: var(--sub); margin: 0 10px; text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="badge">Zenithal Enterprise v6.0</span>
    <button class="btn-sm" onclick="toggleTheme()">Theme</button>
  </div>

  <div class="home" id="homeBox">
    <div class="logo" onclick="location.href='/'">Zenithal</div>
    <p style="color:var(--sub);margin:8px 0 24px;">Enterprise Global Discovery &amp; Intelligence</p>
    <form id="searchForm" style="width:100%;display:flex;flex-direction:column;align-items:center;">
      <input type="text" id="q" class="box" placeholder="Try: 25 * 16, define zenith, weather Kolkata, 10 km to miles, or newton, news, everyday current news..." autofocus required>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="submit" class="btn">Search Zenithal</button>
        <button type="button" class="btn" id="micBtn" onclick="startVoice()">🎤 Voice</button>
        
      </div>
    </form>
   <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;max-width:600px;">
  <button type="button" class="chip" onclick="quickSearch('25 * 16')">🧮 Math: 25 * 16</button>
  <button type="button" class="chip" onclick="quickSearch('define zenith')">📖 define zenith</button>
  <button type="button" class="chip" onclick="quickSearch('weather Kolkata')">🌤 weather Kolkata</button>
  <button type="button" class="chip" onclick="quickSearch('10 km to miles')">⚖ 10 km to miles</button>
  <button type="button" class="chip" onclick="quickSearch('newton')">🔬 Newton's Laws</button>
  <button type="button" class="chip" onclick="quickSearch('news')">📰 News</button>
  <button type="button" class="chip" onclick="quickSearch('everyday current news')">📺 Everyday current news</button>
     
</div>
<div id="zenithal-live-feed" style="margin-top: 18px; font-size: 13px; color: var(--sub);"></div>
</div>
  <div class="main" id="results"></div>
  <footer>
    <div style="margin-bottom:8px;">
      <a href="/about.html">About</a> •
      <a href="/privacy.html">Privacy Policy</a> •
      <a href="/terms.html">Terms</a> •
      <a href="/contact.html">Contact</a>
    </div>
    <div>© 2026 Zenithal Search Engine • Built by Abhinit Pandey</div>
  </footer>
  <script src="/data.js"></script>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('zenithal_theme') || 'black');

    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'black' ? 'white' : 'black';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('zenithal_theme', next);
    }

    function quickSearch(text) {
      document.getElementById('q').value = text;
      runSearch();
    }

    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('Voice search works in Chrome and Edge.');
        return;
      }
      const rec = new SR();
      rec.onresult = function(e) {
        document.getElementById('q').value = e.results.item(0).item(0).transcript;
        runSearch();
      };
      rec.start();
    }

    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      runSearch();
    });

    async function runSearch() {
      const raw = document.getElementById('q').value.trim();
      if (!raw) return;
      const lower = raw.toLowerCase();

      if (lower.startsWith('!yt ')) {
        location.href = 'https://' + '://youtube.com' + encodeURIComponent(raw.slice(4));
        return;
      }
      if (lower.startsWith('!g ')) {
        location.href = 'https://' + '://google.com' + encodeURIComponent(raw.slice(3));
        return;
      }

      const box = document.getElementById('results');
      document.getElementById('homeBox').style.padding = '24px 20px';
      box.innerHTML = '<div class="card">Searching Zenithal...</div>';

      // 1. Math Calculator
      if (/^[0-9+\-*/().\s]+$/.test(raw)) {
        try {
          const ans = Function('"use strict";return (' + raw + ')')();
          box.innerHTML = '<div class="card"><div class="title">🧮 Zenithal Calculator</div><p style="font-size:22px;font-weight:bold;margin:8px 0 0;">' + raw + ' = ' + ans + '</p></div>';
          return;
        } catch (err) {}
      }

      // 2. Unit Converter (e.g. "10 km to miles")
      const parts = lower.split(' ');
      if (parts.length === 4 && (parts.at(2) === 'to' || parts.at(2) === 'in')) {
        const val = parseFloat(parts.at(0));
        const from = parts.at(1);
        const to = parts.at(3);
        const rates = { km_miles: 0.621371, miles_km: 1.60934, m_cm: 100, cm_m: 0.01, kg_lbs: 2.20462, lbs_kg: 0.453592 };
        let out = null;
        if (from === 'c' && to === 'f') out = (val * 9 / 5) + 32;
        else if (from === 'f' && to === 'c') out = (val - 32) * 5 / 9;
        else if (rates[from + '_' + to]) out = val * rates[from + '_' + to];
        if (out !== null && !isNaN(out)) {
          box.innerHTML = '<div class="card"><div class="title">⚖️ Zenithal Unit Converter</div><p style="font-size:22px;font-weight:bold;margin:8px 0 0;">' + val + ' ' + from.toUpperCase() + ' = ' + out.toFixed(2) + ' ' + to.toUpperCase() + '</p></div>';
          return;
        }
      }

      // 3. Dictionary (e.g. "define zenith")
      if (lower.startsWith('define ')) {
        const word = raw.slice(7).trim();
        try {
          const dRes = await fetch('https://' + 'api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
          if (dRes.ok) {
            const dData = await dRes.json();
            const entry = dData.at(0);
            const meaning = entry.meanings.at(0);
            const def = meaning.definitions.at(0).definition;
            box.innerHTML = '<div class="card"><div class="title">📖 Dictionary: ' + entry.word + ' (' + meaning.partOfSpeech + ')</div><p style="margin:8px 0 0;">' + def + '</p></div>';

            return;
          }
        } catch (err) {}
      }

      // 4. Live Weather (e.g. "weather Kolkata")
      if (lower.startsWith('weather ')) {
        const city = raw.slice(8).trim();
        try {
          const gRes = await fetch('https://' + '://open-meteo.com' + encodeURIComponent(city));
          const gData = await gRes.json();
          const p = gData.results.at(0);
          if (p) {
            const wRes = await fetch('https://' + '://open-meteo.com' + p.latitude + '&longitude=' + p.longitude + '&current_weather=true');
            const wData = await wRes.json();
            const cur = wData.current_weather;
            box.innerHTML = '<div class="card"><div class="title">🌤️ Live Weather: ' + p.name + ', ' + p.country + '</div><p style="font-size:22px;font-weight:bold;margin:8px 0 4px;">' + cur.temperature + '°C</p><p style="color:var(--sub);margin:0;">Wind Speed: ' + cur.windspeed + ' km/h</p></div>';
            return;
          }
        } catch (err) {}
      }

      // 5. Zenithal Original Database (data.js)
      let htmlOut = '';
      if (typeof ZENITHAL_DB !== 'undefined') {
        const matches = ZENITHAL_DB.filter(function(item) {
          return item.title.toLowerCase().includes(lower) || item.keywords.some(function(k) { return lower.includes(k) || k.includes(lower); });
        });
        for (let i = 0; i < matches.length; i++) {
          const m = matches.at(i);
          htmlOut += '<div class="card" style="border-left:4px solid #3b82f6;"><div style="font-size:12px;color:#60a5fa;font-weight:bold;">⭐ ZENITHAL ORIGINAL • ' + m.category.toUpperCase() + '</div><div class="title" style="margin-top:4px;">' + m.title + '</div><p style="margin:8px 0 6px;">' + m.summary + '</p><p style="color:var(--sub);font-size:14px;margin:0;">' + m.example + '</p></div>';
        }
      }

      // 6. Live Wikipedia Search
      const apiUrl = 'https://' + 'en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srsearch=' + encodeURIComponent(raw);
      const res = await fetch(apiUrl);
      const data = await res.json();
      const items = (data.query && data.query.search) || [];
      if (!items.length && !htmlOut) {
        box.innerHTML = '<div class="card">No instant results found for "' + raw + '".</div>';
        return;
      }
      for (let i = 0; i < items.length; i++) {
        const item = items.at(i);
        const wUrl = 'https://' + 'en.wikipedia.org/wiki/' + encodeURIComponent(item.title);
        htmlOut += '<div class="card"><a class="title" href="' + wUrl + '" target="_blank">' + item.title + '</a><p style="color:var(--sub);margin:6px 0 0;">' + item.snippet + '...</p></div>';
      }
      box.innerHTML = htmlOut;
    }
   const urlQuery = new URLSearchParams(window.location.search).get('q');
if (urlQuery) {
  document.getElementById('q').value = urlQuery;
  runSearch();
}


const GITHUB_DATA_URL = "https://raw.githubusercontent.com/mumsonarpur-lab/Zenithal/main/zenithal_index.json";

async function syncZenithalEngine() {
  const feed = document.getElementById("zenithal-live-feed");
  if (!feed) return;

  try {
    const response = await fetch(`${GITHUB_DATA_URL}?t=${Date.now()}`);
    if (!response.ok) throw new Error("Index not ready yet");
    const data = await response.json();

    const topStory = Array.isArray(data.top_news) ? data.top_news.at(0) : null;
    const newsHtml = topStory
      ? `<div style="margin-top: 6px;">📰 <b>Breaking:</b> <a href="${topStory.link}" target="_blank" style="color: var(--accent); text-decoration: none;">${topStory.title}</a></div>`
      : "";

    feed.innerHTML = `
      <div>🟢 <b>${data.weather}</b> &bull; Index Updated: <b>${data.last_updated}</b></div>
      ${newsHtml}
    `;
  } catch (err) {
    feed.textContent = "🟢 Zenithal Live Engine Connected";
  }
}

syncZenithalEngine();
setInterval(syncZenithalEngine, 600000);
</script>
  <script type="module" src="/auth.js"></script>
</body>
</html>
