  {
    "@context": "https://schema.org",

    "alternateName": ["Zenithal Search", "Zenithal Search Engine"],
    "url": "https://vercel.app"
  }

  <link rel="manifest" href="/manifest.json">
  <style>
    :root[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --sub: #94a3b8; --accent: #3b82f6; --border: #334155; }
    :root[data-theme="light"] { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --sub: #475569; --accent: #2563eb; --border: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 14px 20px; }
    .badge { background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; }
    .btn-sm { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .logo { font-size: 56px; font-weight: 800; color: var(--accent); letter-spacing: -1px; cursor: pointer; }
    .box { width: 100%; max-width: 580px; padding: 14px 20px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; outline: none; }
    .box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 11px 22px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.92; }
    .chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; }
    .chip:hover { border-color: var(--accent); }
    .main { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px 30px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; text-align: left; }
    .title { font-size: 18px; font-weight: 700; color: #60a5fa; text-decoration: none; }
    footer { text-align: center; padding: 20px 16px; color: var(--sub); font-size: 14px; border-top: 1px solid rgba(148, 163, 184, 0.15); margin-top: auto; }
    footer a { color: var(--sub); margin: 0 10px; text-decoration: none; }
    footer a:hover { color: var(--accent); }

    /* Zenithal Meet Quick-Launch Card */
    .zmeet-card {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
      color: #ffffff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
      text-align: left;
    }
    .zmeet-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .zmeet-card h3 { margin: 0; font-size: 20px; }
    .zmeet-card p { margin: 6px 0 16px; font-size: 14px; opacity: 0.9; }
    .zmeet-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .zmeet-btn-primary {
      background: #ffffff;
      color: #1d4ed8;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .zmeet-join-group { display: flex; gap: 6px; flex: 1; min-width: 220px; }
    .zmeet-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .zmeet-input::placeholder { color: rgba(255, 255, 255, 0.75); }
    .zmeet-btn-secondary {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="badge">Zenithal Enterprise v7.0</span>
    <a href="meet.html" class="btn-sm" style="text-decoration: none;">📹 Zenithal Meet</a>
    <button type="button" class="btn-sm" onclick="toggleTheme()">Theme</button>

    <div class="logo" onclick="location.href='/'">Zenithal</div>
    <p style="color:var(--sub);margin:8px 0 24px;">Enterprise Global Discovery &amp; Intelligence</p>
    <form id="searchForm" style="width:100%;display:flex;flex-direction:column;align-items:center;">
      <input type="text" id="q" class="box" placeholder="Try: zenithal meet, 25 * 16, define zenith, weather Kolkata, 10 km to miles..." autofocus>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="submit" class="btn">Search Zenithal</button>
        <button type="button" class="btn" id="micBtn" onclick="startVoice()">🎤 Voice</button>
      </div>
    </form>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;max-width:650px;">
      <button type="button" class="chip" onclick="quickSearch('zenithal meet')">📹 Zenithal Meet</button>
      <button type="button" class="chip" onclick="quickSearch('25 * 16')">🧮 Math: 25 * 16</button>
      <button type="button" class="chip" onclick="quickSearch('define zenith')">📖 define zenith</button>
      <button type="button" class="chip" onclick="quickSearch('weather Kolkata')">🌤️ weather Kolkata</button>
      <button type="button" class="chip" onclick="quickSearch('10 km to miles')">⚖️ 10 km to miles</button>
      <button type="button" class="chip" onclick="quickSearch('newton')">🔬 Newton's Laws</button>
    </div>
  </div>

  <div class="main" id="results"></div>

  <footer>

      <a href="/about.html">About</a> •
      <a href="/privacy.html">Privacy Policy</a> •
      <a href="/terms.html">Terms</a> •
      <a href="/contact.html">Contact</a>
    </div>
    <div>© 2026 Zenithal Search Engine • Built by Abhinit Pandey</div>
  </footer>

  <script src="/data.js"></script>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('zenithal_theme') || 'dark');

    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('zenithal_theme', next);
    }

    function quickSearch(text) {
      document.getElementById('q').value = text;
      runSearch();
    }

    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('Voice search works in Chrome and Edge.');
        return;
      }
      const rec = new SR();
      rec.onresult = function(e) {
        document.getElementById('q').value = e.results.item(0).item(0).transcript;
        runSearch();
      };
      rec.start();
    }

    // Zenithal Meet Quick-Launch Functions
    function generateZMeetCode() {
      const chars = 'abcdefghijklmnopqrstuvwxyz';
      const part = function(len) {
        let out = '';
        for (let i = 0; i < len; i++) {
          out += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return out;
      };
      return part(3) + '-' + part(4) + '-' + part(3);
    }

    function launchInstantZMeet() {
      const roomCode = generateZMeetCode();
      window.location.href = 'meet.html?room=' + encodeURIComponent(roomCode);
    }

    function joinExistingZMeet() {
      const input = document.getElementById('zmeet-room-input').value.trim();
      if (!input) {
        alert('Please enter a meeting code or link!');
        return;
      }
      let roomCode = input;
      if (input.indexOf('room=') !== -1) {
        roomCode = input.split('room=').at(1).split('&').at(0);
      }
      window.location.href = 'meet.html?room=' + encodeURIComponent(roomCode);
    }

    function getZenithalMeetWidget(query) {
      const q = query.toLowerCase().trim();
      const triggers = ['meet', 'zenithal meet', 'video call', 'start meeting', 'join meeting', 'vmeet'];
      const isTriggered = triggers.some(function(word) {
        return q === word || q.includes('zenithal meet') || q.includes('video call');
      });
      if (!isTriggered) return '';

      return '<div class="zmeet-card">' +
        '<span class="zmeet-badge">ZENITHAL ECOSYSTEM</span>' +
        '<h3>📹 Zenithal Meet</h3>' +
        '<p>Fast, secure video meetings directly in your browser. Start an instant room or join with a code.</p>' +
        '<div class="zmeet-actions">' +
