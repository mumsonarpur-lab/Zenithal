<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZMeet — Zenithal Video Meetings</title>
  <script src="https://jit.si"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #202124;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: #202124;
      border-bottom: 1px solid #3c4043;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
    .brand span { color: #8ab4f8; font-weight: 700; }
    .clock { color: #9aa0a6; font-size: 15px; }
    .lobby {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 32px 24px;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
    }
    .preview-box {
      flex: 1;
      min-width: 320px;
      max-width: 620px;
      background: #171717;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3c4043;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    video#localPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .cam-off-msg {
      position: absolute;
      color: #9aa0a6;
      font-size: 16px;
      display: none;
    }
    .preview-controls {
      position: absolute;
      bottom: 16px;
      display: flex;
      gap: 14px;
    }
    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #5f6368;
      background: rgba(32, 33, 36, 0.85);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn.off {
      background: #ea4335;
      border-color: #ea4335;
    }
    .join-panel {
      flex: 1;
      min-width: 300px;
      max-width: 400px;
      text-align: center;
    }
    .join-panel h1 {
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 10px;
    }
    .room-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #303134;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 14px;
      color: #8ab4f8;
      margin-bottom: 20px;
      border: 1px solid #3c4043;
    }
    .copy-btn {
      background: none;
      border: none;
      color: #e8eaed;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .input-field {
      width: 100%;
      padding: 13px 16px;
      border-radius: 8px;
      border: 1px solid #5f6368;
      background: #303134;
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
    }
    .input-field:focus { border-color: #8ab4f8; }
    .btn-join {
      width: 100%;
      padding: 13px;
      border-radius: 99px;
      border: none;
      background: #8ab4f8;
      color: #202124;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-join:hover { background: #aecbfa; }
    .btn-new {
      width: 100%;
      padding: 11px;
      border-radius: 99px;
      border: 1px solid #5f6368;
      background: transparent;
      color: #8ab4f8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #meetingContainer {
      display: none;
      width: 100%;
      height: calc(100vh - 61px);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/" class="brand">📹 <span>ZMeet</span> <small style="font-size:13px;color:#9aa0a6;font-weight:400;">by Zenithal</small></a>
    <div class="clock" id="clock"></div>
  </div>

  <div class="lobby" id="lobbyView">
    <div class="preview-box">
      <video id="localPreview" autoplay muted playsinline></video>
      <div class="cam-off-msg" id="camOffMsg">Camera is off</div>
      <div class="preview-controls">
        <button type="button" class="circle-btn" id="micToggle" onclick="togglePreviewMic()" title="Toggle Mic">🎤</button>
        <button type="button" class="circle-btn" id="camToggle" onclick="togglePreviewCam()" title="Toggle Camera">📷</button>
      </div>
    </div>

    <div class="join-panel">
      <h1>Ready to join?</h1>
      <div class="room-pill">
        <span id="roomLabel">zen-meet-room</span>
        <button type="button" class="copy-btn" onclick="copyInviteLink()">📋 Copy link</button>
      </div>

      <input type="text" id="userName" class="input-field" placeholder="Your name (e.g. Abhinit Pandey)" value="Abhinit Pandey" />
      <input type="text" id="roomInput" class="input-field" placeholder="Enter or edit room code" />

      <button type="button" class="btn-join" onclick="startZMeetCall()">Join now</button>
      <button type="button" class="btn-new" onclick="generateNewRoom()">+ Generate new meeting code</button>
    </div>
  </div>

  <div id="meetingContainer"></div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' • ' + now.toDateString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function makeCode() {
      const c = 'abcdefghijklmnopqrstuvwxyz';
      const part = function(n) {
        let out = '';
        for (let i = 0; i < n; i++) {
          out += c.charAt(Math.floor(Math.random() * c.length));
        }
        return out;
      };
      return part(3) + '-' + part(4) + '-' + part(3);
    }

    const params = new URLSearchParams(window.location.search);
    let currentRoom = params.get('room') || makeCode();
    document.getElementById('roomInput').value = currentRoom;
    document.getElementById('roomLabel').textContent = currentRoom;

    function generateNewRoom() {
      currentRoom = makeCode();
      document.getElementById('roomInput').value = currentRoom;
      document.getElementById('roomLabel').textContent = currentRoom;
      window.history.replaceState({}, '', '?room=' + encodeURIComponent(currentRoom));
    }

    document.getElementById('roomInput').addEventListener('input', function(e) {
      currentRoom = e.target.value.trim() || makeCode();
      document.getElementById('roomLabel').textContent = currentRoom;
    });

    function copyInviteLink() {
      const link = window.location.origin + '/meet.html?room=' + encodeURIComponent(currentRoom);
      navigator.clipboard.writeText(link);
      alert('Meeting link copied! Share this link so others can join:\n' + link);
    }

    let previewStream = null;
    let micOn = true;
    let camOn = true;

    async function initPreview() {
      try {
        previewStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localPreview').srcObject = previewStream;
      } catch (err) {
        document.getElementById('camOffMsg').style.display = 'block';
        document.getElementById('camOffMsg').textContent = 'Camera/Mic permission needed';
      }
    }
    initPreview();

    function togglePreviewMic() {
      micOn = !micOn;
      if (previewStream) previewStream.getAudioTracks().forEach(function(t) { t.enabled = micOn; });
      const btn = document.getElementById('micToggle');
      btn.classList.toggle('off', !micOn);
      btn.textContent = micOn ? '🎤' : '🔇';
    }

    function togglePreviewCam() {
      camOn = !camOn;
      if (previewStream) previewStream.getVideoTracks().forEach(function(t) { t.enabled = camOn; });
      const btn = document.getElementById('camToggle');
      btn.classList.toggle('off', !camOn);
      btn.textContent = camOn ? '📷' : '🚫';
      document.getElementById('camOffMsg').style.display = camOn ? 'none' : 'block';
    }

    function startZMeetCall() {
      const name = document.getElementById('userName').value.trim() || 'Zenithal User';
      const room = document.getElementById('roomInput').value.trim() || currentRoom;

      if (previewStream) {
        previewStream.getTracks().forEach(function(track) { track.stop(); });
      }

      document.getElementById('lobbyView').style.display = 'none';
      const container = document.getElementById('meetingContainer');
      container.style.display = 'block';

      const api = new JitsiMeetExternalAPI('meet.jit.si', {
        roomName: 'ZenithalZMeet_' + room.replace(/[^a-zA-Z0-9_-]/g, ''),
        parentNode: container,
        width: '100%',
        height: '100%',
        userInfo: { displayName: name },
        configOverwrite: {
          startWithAudioMuted: !micOn,
          startWithVideoMuted: !camOn,
          prejoinPageEnabled: false
        },
        interfaceConfigOverwrite: {
          APP_NAME: 'ZMeet',
          SHOW_JITSI_WATERMARK: false,
          SHOW_WATERMARK_FOR_GUESTS: false
        }
      });

      api.addEventListener('readyToClose', function() {
        window.location.href = '/';
      });
    }
  </script>
</body>
</html>
