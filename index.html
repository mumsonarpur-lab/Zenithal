<!DOCTYPE html>
<!-- saved from url=(0022)http://127.0.0.1:5000/ -->
<html lang="en" data-theme="dark"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="google-site-verification" content="celRh5m3sgG_1hAXN0hw7IsFpL272ucsU1dihV9vtxw" />
<title>Zenithal Search™ v6.0</title>
    <meta name="description" content="Zenithal Search is a fast, clean, and modern web search engine built by Abhinit Pandey." />
<link rel="canonical" href="https://zenithal-search.vercel.app" />

    <link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

<style>
:root { --bg:#fff; --text:#1e293b; --sub:#64748b; --card:#f8fafc; --border:#e2e8f0; --accent:#4f46e5; --link:#2563eb; }
[data-theme="dark"] { --bg:#0f172a; --text:#f1f5f9; --sub:#94a3b8; --card:#1e293b; --border:#334155; --accent:#6366f1; --link:#60a5fa; }
body { font-family:'Segoe UI',sans-serif; margin:0; background:var(--bg); color:var(--text); }
.bar { display:flex; justify-content:flex-end; align-items:center; padding:14px 28px; gap:12px; font-size:13px; }
.badge { background:rgba(16,185,129,.15); color:#10b981; padding:4px 10px; border-radius:12px; font-weight:600; }
.btn-sm { background:var(--card); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer; text-decoration:none; }
.home { display:flex; flex-direction:column; align-items:center; justify-content:center; height:74vh; padding:0 20px; }
.logo { font-size:62px; font-weight:800; background:linear-gradient(135deg,#4f46e5,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-decoration:none; }
.box { width:100%; max-width:580px; padding:14px 20px; font-size:16px; background:var(--card); color:var(--text); border:2px solid var(--border); border-radius:12px; outline:none; }
.btn { margin-top:18px; padding:12px 26px; font-size:15px; font-weight:600; background:var(--accent); color:#fff; border:none; border-radius:10px; cursor:pointer; }
.hdr { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--border); gap:16px; }
.hdr .logo { font-size:28px; }
.tabs { display:flex; gap:20px; padding-left:40px; border-bottom:1px solid var(--border); font-size:14px; }
.tab { padding:10px 4px; text-decoration:none; color:var(--sub); border-bottom:3px solid transparent; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
.main { max-width:720px; margin:24px 40px; }
.card { background:var(--card); border-left:4px solid var(--accent); padding:14px; border-radius:8px; margin-bottom:20px; }
.item { margin-bottom:22px; }
.title { font-size:18px; font-weight:600; color:var(--link); text-decoration:none; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; padding:24px 40px; }
.img-card { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; text-decoration:none; color:var(--text); }
.img-card img { width:100%; height:140px; object-fit:cover; display:block; }
</style>
</head>
<body>

  <div class="bar">
    <span class="badge">Zenithal Enterprise v6.0</span>
    <button class="btn-sm" onclick="toggleTheme()">Theme</button>
  </div>
  <div class="home" id="homeBox">
    <div class="logo">Zenithal</div>
    <p style="color:var(--sub);margin:8px 0 26px;">Enterprise Global Discovery &amp; Intelligence</p>
    <form id="searchForm" style="width:100%;display:flex;flex-direction:column;align-items:center;">
      <input type="text" id="q" class="box" placeholder="Try searching: python, wikipedia, !yt music, or 25 * 16..." autofocus required>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn">Search Zenithal</button>
        <button type="button" class="btn" id="micBtn" onclick="startVoice()">🎤 Voice</button>
      </div>
    </form>
  </div>
  <div class="main" id="results"></div>

  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('zenithal_theme') || 'dark');
    function toggleTheme() {
      const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('zenithal_theme', n);
    }

    function startVoice() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return alert('Voice search is supported in Chrome and Edge.');
      const rec = new SpeechRec();
      rec.onresult = e => {
        document.getElementById('q').value = e.results[0][0].transcript;
        document.getElementById('searchForm').dispatchEvent(new Event('submit'));
      };
      rec.start();
    }

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const raw = document.getElementById('q').value.trim();
      if (!raw) return;

           // Instant !bangs shortcuts
      if (raw.startsWith('!yt ')) return location.href = 'https://' + '://youtube.com' + encodeURIComponent(raw.slice(4));
      if (raw.startsWith('!g ')) return location.href = 'https://' + '://google.com' + encodeURIComponent(raw.slice(3));
      if (raw.startsWith('!wiki ')) return location.href = 'https://' + 'en.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(raw.slice(6));

      const box = document.getElementById('results');
      document.getElementById('homeBox').style.height = 'auto';
      box.innerHTML = '<div class="card">Searching Zenithal...</div>';

      // Built-in math calculator
      if (/^[0-9+\-*/().\s]+$/.test(raw)) {
        try {
          const ans = Function('"use strict";return (' + raw + ')')();
          box.innerHTML = `<div class="card"><div class="title">Calculator Result</div><p style="font-size:22px;font-weight:bold;">${raw} = ${ans}</p></div>`;
          return;
        } catch {}
      }

      // Live Wikipedia Search API
      const apiUrl = 'https://' + 'en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srsearch=' + encodeURIComponent(raw);
      const res = await fetch(apiUrl);
      const data = await res.json();
      const items = data.query?.search || [];
      if (!items.length) {
        const gUrl = 'https://www.google.com/search?q=' + encodeURIComponent(raw);


        box.innerHTML = `<div class="card">No instant results found. <a class="title" href="${gUrl}" target="_blank">Search on Google instead →</a></div>`;
    return;
      }
      box.innerHTML = items.map(item => {
        const wUrl = 'https://' + 'en.wikipedia.org/wiki/' + encodeURIComponent(item.title);
        return `
        <div class="card item">
          <a class="title" href="${wUrl}" target="_blank">${item.title}</a>
          <p style="color:var(--sub);margin:6px 0 0;">${item.snippet}...</p>
        </div>
      `;
      }).join('');

    });
  </script>


</body></html>
