<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZMeet — Zenithal Video Meetings</title>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #202124;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: #202124;
      border-bottom: 1px solid #3c4043;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
    .brand span { color: #8ab4f8; font-weight: 700; }
    .host-badge {
      background: rgba(138, 180, 248, 0.15);
      color: #8ab4f8;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }
    .clock { color: #9aa0a6; font-size: 14px; }

    /* Lobby / Green Room */
    .lobby {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 32px 24px;
      max-width: 1150px;
      margin: 0 auto;
      width: 100%;
    }
    .preview-box {
      flex: 1;
      min-width: 320px;
      max-width: 620px;
      background: #171717;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3c4043;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    video#localPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .cam-off-msg {
      position: absolute;
      color: #9aa0a6;
      font-size: 16px;
      display: none;
    }
    .preview-controls {
      position: absolute;
      bottom: 16px;
      display: flex;
      gap: 14px;
    }
    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #5f6368;
      background: rgba(32, 33, 36, 0.85);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn.off { background: #ea4335; border-color: #ea4335; }

    /* Join Panel */
    .join-panel {
      flex: 1;
      min-width: 300px;
      max-width: 400px;
      text-align: center;
    }
    .join-panel h1 { font-size: 28px; font-weight: 500; margin: 0 0 10px; }
    .room-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #303134;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 14px;
      color: #8ab4f8;
      margin-bottom: 18px;
      border: 1px solid #3c4043;
    }
    .copy-btn {
      background: none;
      border: none;
      color: #e8eaed;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .input-field {
      width: 100%;
      padding: 13px 16px;
      border-radius: 8px;
      border: 1px solid #5f6368;
      background: #303134;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    .input-field:focus { border-color: #8ab4f8; }
    .role-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #bdc1c6;
      cursor: pointer;
    }
    .btn-join {
      width: 100%;
      padding: 13px;
      border-radius: 99px;
      border: none;
      background: #8ab4f8;
      color: #202124;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-join:hover { background: #aecbfa; }
    .btn-new {
      width: 100%;
      padding: 11px;
      border-radius: 99px;
      border: 1px solid #5f6368;
      background: transparent;
      color: #8ab4f8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Guest Waiting Overlay */
    #waitingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(32, 33, 36, 0.96);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #3c4043;
      border-top-color: #8ab4f8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Google Meet Host "Admit / Deny" Popup */
    #admitQueue {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
    }
    .admit-card {
      background: #303134;
      border: 1px solid #5f6368;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .admit-card h4 { margin: 0 0 6px; font-size: 15px; color: #fff; }
    .admit-card p { margin: 0 0 14px; font-size: 13px; color: #bdc1c6; }
    .admit-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-deny {
      background: transparent;
      border: 1px solid #5f6368;
      color: #f28b82;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-admit {
      background: #8ab4f8;
      border: none;
      color: #202124;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Active Video Call Frame */
    #meetingContainer {
      display: none;
      width: 100%;
      height: calc(100vh - 57px);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="/" class="brand">📹 <span>ZMeet</span> <small style="font-size:13px;color:#9aa0a6;font-weight:400;">by Zenithal</small></a>
      <span class="host-badge" id="hostBadge">👑 Host Controls Active</span>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <!-- Pre-Join Green Room -->
  <div class="lobby" id="lobbyView">
    <div class="preview-box">
      <video id="localPreview" autoplay muted playsinline></video>
      <div class="cam-off-msg" id="camOffMsg">Camera is off</div>
      <div class="preview-controls">
        <button type="button" class="circle-btn" id="micToggle" onclick="togglePreviewMic()">🎤</button>
        <button type="button" class="circle-btn" id="camToggle" onclick="togglePreviewCam()">📷</button>
      </div>
    </div>

    <div class="join-panel">
      <h1 id="lobbyTitle">Ready to join?</h1>
      <div class="room-pill">
        <span id="roomLabel">zen-meet-room</span>
        <button type="button" class="copy-btn" onclick="copyInviteLink()">📋 Copy invite link</button>
      </div>

      <input type="text" id="userName" class="input-field" placeholder="Enter your name" />
      <input type="text" id="roomInput" class="input-field" placeholder="Meeting code" />

      <label class="role-toggle">
        <input type="checkbox" id="isHostCheckbox" />
        <span>Start as Meeting Host (Approve guests)</span>
      </label>

      <button type="button" class="btn-join" id="mainJoinBtn" onclick="handleJoinClick()">Join now</button>
      <button type="button" class="btn-new" onclick="generateNewRoom()">+ Create new meeting as Host</button>
    </div>
  </div>

  <!-- Guest Knock / Waiting Screen -->
  <div id="waitingOverlay">
    <div class="spinner"></div>
    <h2 id="waitHeading">Asking to be let in...</h2>
    <p id="waitSub" style="color:#9aa0a6;max-width:400px;">You'll join the ZMeet call automatically as soon as the host lets you in.</p>
    <button type="button" class="btn-new" style="max-width:200px;margin-top:16px;" onclick="location.href='/'">Cancel</button>
  </div>

  <!-- Host Admit / Deny Popup Container -->
  <div id="admitQueue"></div>

  <!-- Live Video Call -->
  <div id="meetingContainer"></div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' • ' + now.toDateString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function makeCode() {
      const c = 'abcdefghijklmnopqrstuvwxyz';
      const part = function(n) {
        let out = '';
        for (let i = 0; i < n; i++) out += c.charAt(Math.floor(Math.random() * c.length));
        return out;
      };
      return part(3) + '-' + part(4) + '-' + part(3);
    }

    const params = new URLSearchParams(window.location.search);
    const hasUrlRoom = Boolean(params.get('room'));
    let currentRoom = params.get('room') || makeCode();

    document.getElementById('roomInput').value = currentRoom;
    document.getElementById('roomLabel').textContent = currentRoom;

    // If opened with ?host=1 or without a ?room= parameter, default to Host mode
    if (params.get('host') === '1' || !hasUrlRoom) {
      document.getElementById('isHostCheckbox').checked = true;
      document.getElementById('userName').value = 'Abhinit Pandey';
      document.getElementById('mainJoinBtn').textContent = 'Start meeting as Host';
    } else {
      document.getElementById('isHostCheckbox').checked = false;
      document.getElementById('mainJoinBtn').textContent = 'Ask to join';
    }
