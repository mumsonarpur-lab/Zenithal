<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenithal Meet</title>
  <link rel="icon" href="image.png" />
        <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: #ffffff; color: #202124; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    body.in-call { background: #202124; color: #e8eaed; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.38rem; font-weight: 400; color: #5f6368; text-decoration: none; }
    .brand img { width: 32px; height: 32px; border-radius: 6px; }
    .brand strong { font-weight: 500; color: #202124; }
    .header-right { display: flex; align-items: center; gap: 16px; font-size: 0.92rem; color: #5f6368; }
    .nav-link { color: #1a73e8; text-decoration: none; font-weight: 500; }

    #lobby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    #lobby h1 { font-size: 2.5rem; font-weight: 400; margin-bottom: 14px; max-width: 640px; color: #202124; }
    #lobby p { color: #5f6368; font-size: 1.1rem; margin-bottom: 34px; max-width: 520px; }
    .lobby-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
    .dropdown-wrapper { position: relative; }
    .btn-blue { background: #1a73e8; color: #fff; border: none; padding: 13px 22px; border-radius: 6px; font-size: 1rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-blue:hover { background: #1765cc; }
    .dropdown-menu { display: none; position: absolute; top: 52px; left: 0; width: 270px; background: #fff; border: 1px solid #dadce0; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); z-index: 100; text-align: left; overflow: hidden; }
    .dropdown-item { padding: 13px 16px; cursor: pointer; font-size: 0.95rem; color: #202124; }
    .dropdown-item:hover { background: #f1f3f4; }
    .join-box { display: flex; gap: 8px; }
    .join-box input { border: 1px solid #dadce0; padding: 12px 16px; border-radius: 6px; font-size: 1rem; width: 240px; outline: none; }
    .join-box input:focus { border-color: #1a73e8; border-width: 2px; }
    .btn-text { background: transparent; color: #1a73e8; border: none; padding: 12px 16px; font-size: 1rem; font-weight: 500; cursor: pointer; border-radius: 6px; }
    .btn-text:hover { background: #f1f3f4; }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 200; }
    .modal-card { background: #fff; padding: 24px; border-radius: 12px; width: 380px; max-width: 92%; box-shadow: 0 8px 28px rgba(0,0,0,0.25); }
    .link-copy-box { display: flex; align-items: center; justify-content: space-between; background: #f1f3f4; padding: 10px 12px; border-radius: 8px; margin: 14px 0; font-size: 0.88rem; gap: 8px; }
    .link-copy-box span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Google Meet Green Room */
    #preview-screen { display: none; flex: 1; align-items: center; justify-content: center; padding: 20px 40px; gap: 60px; flex-wrap: wrap; }
    .preview-column { display: flex; flex-direction: column; align-items: center; max-width: 640px; width: 100%; }
    .preview-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #202124; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .preview-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .preview-box video.blurred { filter: blur(10px); }
    #cam-status-text { position: absolute; color: #ffffff; font-size: 1.25rem; pointer-events: none; }
    .preview-name-overlay { position: absolute; top: 16px; left: 20px; color: #fff; font-size: 0.92rem; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.6); z-index: 5; }
    .audio-dot { position: absolute; bottom: 16px; left: 18px; width: 28px; height: 28px; border-radius: 50%; background: #a8c7fa; color: #041e49; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; z-index: 5; }
    .preview-controls { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 5; }
    .g-circle-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(60,64,67,0.85); color: #fff; font-size: 1.15rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .g-circle-btn.off { background: #ea4335; border-color: #ea4335; }
    .g-circle-btn.active { background: #8ab4f8; color: #202124; }

    .device-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; justify-content: center; width: 100%; }
    .device-pill { display: flex; align-items: center; gap: 6px; border: 1px solid #dadce0; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; color: #3c4043; background: #fff; cursor: pointer; }
    .device-pill select { border: none; background: transparent; color: #3c4043; font-size: 0.85rem; outline: none; max-width: 115px; }

    .ready-panel { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 280px; gap: 16px; }
    .ready-panel h2 { font-size: 1.85rem; font-weight: 400; color: #202124; }
    .name-field { width: 250px; padding: 10px 14px; border: 1px solid #dadce0; border-radius: 24px; font-size: 0.95rem; text-align: center; outline: none; }
    .ask-join-btn { background: #0b57d0; color: #fff; border: none; padding: 14px 42px; border-radius: 28px; font-size: 1rem; font-weight: 500; cursor: pointer; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0b57d0; }
    .other-ways-btn { border: 1px solid #dadce0; background: #fff; color: #0b57d0; padding: 9px 20px; border-radius: 20px; font-size: 0.88rem; font-weight: 500; cursor: pointer; }

    /* Active Call */
    #call-screen { display: none; flex: 1; flex-direction: column; height: 100%; position: relative; }
    .main-area { flex: 1; display: flex; padding: 16px; gap: 16px; overflow: hidden; position: relative; }
    .video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: center; justify-content: center; }
    .video-card { position: relative; background: #3c4043; border-radius: 12px; overflow: hidden; width: 100%; height: 100%; max-height: 76vh; display: flex; align-items: center; justify-content: center; border: 3px solid transparent; }
    .video-card.hand-raised { border-color: #fbbc04; }
    .video-card video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .video-card video.blurred { filter: blur(10px); }
    .video-card video.screen-share { transform: none; object-fit: contain; }
    .name-tag { position: absolute; bottom: 12px; left: 14px; background: rgba(0,0,0,0.65); color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 0.88rem; }
    .hand-badge { position: absolute; top: 12px; left: 14px; background: #fbbc04; color: #202124; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: none; }
    .video-card.hand-raised .hand-badge { display: block; }

    #ready-popup { position: absolute; bottom: 92px; left: 24px; width: 340px; background: #fff; color: #202124; padding: 18px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); z-index: 60; }
    #ready-popup h3 { font-size: 1.05rem; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .ready-link-bar { display: flex; align-items: center; justify-content: space-between; background: #f1f3f4; padding: 8px 10px; border-radius: 6px; font-size: 0.82rem; gap: 6px; margin-top: 10px; }
    .ready-link-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #reaction-layer { position: absolute; bottom: 90px; left: 40px; pointer-events: none; z-index: 50; }
    .floating-emoji { position: absolute; bottom: 0; font-size: 2.2rem; animation: floatUp 2.5s ease-out forwards; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-260px) scale(1.3); opacity: 0; } }
    #emoji-bar { display: none; position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); background: #3c4043; padding: 8px 14px; border-radius: 30px; gap: 10px; z-index: 40; }
    #emoji-bar button { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

    .side-drawer { display: none; width: 320px; background: #fff; color: #202124; border-radius: 12px; flex-direction: column; overflow: hidden; }
    .drawer-header { padding: 16px; font-weight: 600; border-bottom: 1px solid #dadce0; display: flex; justify-content: space-between; }
    .drawer-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.92rem; }
    .person-row, .msg { background: #f1f3f4; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; }
    .chat-input { display: flex; padding: 10px; border-top: 1px solid #dadce0; }
    .chat-input input { flex: 1; border: none; outline: none; padding: 8px; font-size: 0.95rem; }
    .chat-input button { background: #1a73e8; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }

    .bottom-bar { height: 78px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; }
    .room-info { font-size: 0.92rem; display: flex; align-items: center; gap: 10px; }
