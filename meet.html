<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZMeet — Zenithal Video Meetings</title>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #202124;
      color: #e8eaed;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #202124;
      border-bottom: 1px solid #3c4043;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
    .brand span { color: #8ab4f8; font-weight: 700; }
    .host-badge {
      background: rgba(138, 180, 248, 0.15);
      color: #8ab4f8;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }
    .clock { color: #9aa0a6; font-size: 13px; }

    /* Pre-Join Green Room */
    .lobby {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }
    .preview-box {
      flex: 1;
      min-width: 290px;
      max-width: 560px;
      background: #171717;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3c4043;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    video { width: 100%; height: 100%; object-fit: cover; background: #171717; }
    video.mirror { transform: scaleX(-1); }
    .cam-off-msg {
      position: absolute;
      color: #9aa0a6;
      font-size: 15px;
      text-align: center;
      padding: 0 16px;
      display: none;
    }
    .preview-controls {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 14px;
      z-index: 2;
    }
    .circle-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #5f6368;
      background: rgba(32, 33, 36, 0.85);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn.off { background: #ea4335; border-color: #ea4335; }

    /* Join Panel */
    .join-panel {
      flex: 1;
      min-width: 290px;
      max-width: 390px;
      text-align: center;
    }
    .join-panel h1 { font-size: 26px; font-weight: 500; margin: 0 0 10px; }
    .room-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #303134;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 14px;
      color: #8ab4f8;
      margin-bottom: 16px;
      border: 1px solid #3c4043;
    }
    .copy-btn {
      background: none;
      border: none;
      color: #e8eaed;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #5f6368;
      background: #303134;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    .input-field:focus { border-color: #8ab4f8; }
    .role-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #bdc1c6;
      cursor: pointer;
    }
    .btn-join {
      width: 100%;
      padding: 13px;
      border-radius: 99px;
      border: none;
      background: #8ab4f8;
      color: #202124;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-join:hover { background: #aecbfa; }
    .btn-new {
      width: 100%;
      padding: 11px;
      border-radius: 99px;
      border: 1px solid #5f6368;
      background: transparent;
      color: #8ab4f8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Native Google Meet Active Call Stage */
    #callStage {
      display: none;
      flex: 1;
      flex-direction: column;
      height: calc(100vh - 51px);
      background: #202124;
      position: relative;
    }
    .stage-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      padding: 16px;
      align-items: center;
      justify-items: center;
      overflow-y: auto;
    }
    .video-tile {
      width: 100%;
      height: 100%;
      min-height: 200px;
      max-height: 460px;
      background: #303134;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .name-tag {
      position: absolute;
      bottom: 10px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    /* In-Call Chat Drawer */
    .chat-panel {
      width: 310px;
      max-width: 85vw;
      background: #292a2d;
      border-left: 1px solid #3c4043;
      display: none;
      flex-direction: column;
    }
    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid #3c4043;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
    }
    .chat-msg {
      background: #3c4043;
      padding: 8px 12px;
      border-radius: 10px;
    }
    .chat-msg small { display: block; color: #8ab4f8; font-weight: 600; margin-bottom: 2px; }
    .chat-input-row {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #3c4043;
    }
    .chat-input-row input {
      flex: 1;
      background: #303134;
      border: 1px solid #5f6368;
      color: #fff;
      border-radius: 99px;
      padding: 8px 14px;
      outline: none;
    }

    /* Google Meet Bottom Control Bar */
    .bottom-bar {
      height: 72px;
      background: #202124;
      border-top: 1px solid #3c4043;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
    }
    .room-info { font-size: 13px; color: #e8eaed; font-weight: 500; }
    .call-controls { display: flex; gap: 10px; align-items: center; }
    .hangup-btn {
      background: #ea4335;
      color: #fff;
      border: none;
      padding: 0 20px;
      height: 44px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Guest Waiting Overlay */
    #waitingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(32, 33, 36, 0.96);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #3c4043;
      border-top-color: #8ab4f8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Host Admit/Deny Card */
    #admitQueue {
      position: fixed;
      bottom: 86px;
      left: 16px;
      right: 16px;
      max-width: 360px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admit-card {
      background: #303134;
      border: 1px solid #8ab4f8;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .admit-card h4 { margin: 0 0 6px; font-size: 15px; color: #fff; }
    .admit-card p { margin: 0 0 14px; font-size: 13px; color: #bdc1c6; }
    .admit-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-deny {
      background: transparent;
      border: 1px solid #5f6368;
      color: #f28b82;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-admit {
      background: #8ab4f8;
      border: none;
      color: #202124;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .room-info { display: none; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="/" class="brand">📹 <span>ZMeet</span></a>
      <span class="host-badge" id="hostBadge">👑 Host</span>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <!-- Pre-Join Green Room -->
  <div class="lobby" id="lobbyView">
    <div class="preview-box">
      <video id="localPreview" class="mirror" autoplay muted playsinline></video>
      <div class="cam-off-msg" id="camOffMsg">Camera preview unavailable</div>
      <div class="preview-controls">
        <button type="button" class="circle-btn" id="micToggle" onclick="toggleMic()">🎤</button>
        <button type="button" class="circle-btn" id="camToggle" onclick="toggleCam()">📷</button>
      </div>
    </div>

    <div class="join-panel">
      <h1>Ready to join?</h1>
      <div class="room-pill">
        <span id="roomLabel">zen-meet-room</span>
